const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
 const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
 const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
 const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.data)));
 try{sessionStorage.setItem("gl-pw",pw)}catch(e){}
 document.open();document.write(html);document.close();
}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector("button");btn.textContent="Opening…";
 try{await open_(document.getElementById("pw").value)}catch(x){document.getElementById("err").textContent="That password didn't work.";btn.textContent="Open"}};
(async()=>{let pw=null;try{pw=sessionStorage.getItem("gl-pw")}catch(e){}if(pw){try{await open_(pw)}catch(e){}}})();
</script></body></html>
